# Starting state: `ledger` (go-httpbin, container port 8080) and `loader`
# (curl client) in `depot`, and `shuttle` (curl client) in `starfleet`.
# Each workload has its own service account. Nothing segments the namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: depot
---
apiVersion: v1
kind: Namespace
metadata:
  name: starfleet
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ledger
  namespace: depot
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: loader
  namespace: depot
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: shuttle
  namespace: starfleet
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger
  namespace: depot
  labels:
    app: ledger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ledger
  template:
    metadata:
      labels:
        app: ledger
    spec:
      serviceAccountName: ledger
      containers:
        - name: ledger
          image: mccutchen/go-httpbin:2.25.0
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ledger
  namespace: depot
spec:
  selector:
    app: ledger
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loader
  namespace: depot
  labels:
    app: loader
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loader
  template:
    metadata:
      labels:
        app: loader
    spec:
      serviceAccountName: loader
      containers:
        - name: loader
          image: curlimages/curl:8.22.0
          command: ["sh", "-c", "while true; do sleep 30; done"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shuttle
  namespace: starfleet
  labels:
    app: shuttle
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shuttle
  template:
    metadata:
      labels:
        app: shuttle
    spec:
      serviceAccountName: shuttle
      containers:
        - name: shuttle
          image: curlimages/curl:8.22.0
          command: ["sh", "-c", "while true; do sleep 30; done"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
