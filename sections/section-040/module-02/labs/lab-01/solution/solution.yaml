# Reference solution for the segmentation lab.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: depot
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ledger-ingress
  namespace: depot
spec:
  podSelector:
    matchLabels:
      app: ledger
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: loader
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: starfleet
          podSelector:
            matchLabels:
              app: shuttle
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: depot-quota
  namespace: depot
spec:
  hard:
    pods: "10"
    requests.cpu: 500m
    requests.memory: 512Mi
    limits.memory: 1Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: depot-container-defaults
  namespace: depot
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 10m
        memory: 32Mi
      default:
        memory: 128Mi
      max:
        memory: 256Mi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ledger
  namespace: depot
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: loader
  namespace: depot
automountServiceAccountToken: false
