# Knowledge check for section 040. Listed in astrona.yaml as a `type: quiz` entry after the capstone lab.
schema_version: 1
kind: question_bank
id: ats041-040
course_id: ATS041
exam_code: KCSA
status: alpha
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: section
  id: section-040
  title: "Isolation Techniques"
questions:
  - id: ats041-040-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Separate what a namespace hides from what a cgroup limits"
    source_readings:
      - sections/section-040/module-01/course-01-process-isolation-and-its-security-limits.md
    prompt: |-
      A pod sets `resources.limits.memory`. Which kernel feature enforces that limit on the container?
    options:
      - id: a
        text: "A PID namespace, which gives the container its own process list."
        explanation: "A PID namespace controls which processes the container can see. It does not limit memory use."
      - id: b
        text: "A seccomp profile, which filters system calls."
        explanation: "A seccomp profile filters system calls. It does not count memory."
      - id: c
        text: "A control group (cgroup), which limits and counts the resource use of the processes."
        explanation: "Correct. The kubelet and the container runtime write the limit into the cgroup of the container."
      - id: d
        text: "A user namespace, which maps user identifiers."
        explanation: "A user namespace maps user identifiers. It does not limit memory."
    correct_option: c
    explanation: "The kubelet and the container runtime write the limit into the cgroup of the container."
  - id: ats041-040-q02
    type: single_choice
    difficulty: beginner
    learning_objective: "Explain what containers on one node share"
    source_readings:
      - sections/section-040/module-01/course-01-process-isolation-and-its-security-limits.md
    prompt: |-
      Two containers from different pods run on the same worker node. What do they share?
    options:
      - id: a
        text: "The process list, because both run on one node."
        explanation: "Each container has its own PID namespace, so the process lists are separate."
      - id: b
        text: "The node kernel, because a container has no kernel of its own."
        explanation: "Correct. Every container sends its system calls to the same kernel, so a kernel flaw can affect all of them."
      - id: c
        text: "The root file system, because both use the same image format."
        explanation: "Each container has its own mount namespace built from its own image."
      - id: d
        text: "Nothing, because each container is a small virtual machine."
        explanation: "A container is not a virtual machine and has no guest kernel."
    correct_option: b
    explanation: "Every container sends its system calls to the same kernel, so a kernel flaw can affect all of them."
  - id: ats041-040-q03
    type: single_choice
    difficulty: intermediate
    learning_objective: "Identify what a Kubernetes namespace does not isolate"
    source_readings:
      - sections/section-040/module-01/course-02-segmentation-across-workloads-and-identities.md
    prompt: |-
      A pod in the namespace `outpost` calls a Service in the namespace `starfleet` and gets a response. No NetworkPolicy exists. Why does the request succeed?
    options:
      - id: a
        text: "Services ignore namespaces."
        explanation: "The name of a Service includes its namespace, so this is not the reason."
      - id: b
        text: "The pod uses a service account with wide rights."
        explanation: "A service account does not decide whether a network packet is delivered."
      - id: c
        text: "The namespace `outpost` has no quota."
        explanation: "A quota limits resource use and has no effect on network traffic."
      - id: d
        text: "A Kubernetes namespace scopes names and does not block traffic by itself, and by default every pod accepts traffic from every pod."
        explanation: "Correct. A NetworkPolicy enforced by the network plugin changes that default."
    correct_option: d
    explanation: "A NetworkPolicy enforced by the network plugin changes that default."
  - id: ats041-040-q04
    type: single_choice
    difficulty: intermediate
    learning_objective: "Identify the pod field that shares the node process list"
    source_readings:
      - sections/section-040/module-01/course-03-host-access-in-the-pod-spec.md
    prompt: |-
      A review finds a pod with `hostPID: true`. What does this field give the pod?
    options:
      - id: a
        text: "The PID namespace of the node, so the pod sees the processes of the node."
        explanation: "Correct. `hostPID` removes the process separation between the pod and the node."
      - id: b
        text: "A PID namespace shared by the containers of the pod only."
        explanation: "That is `shareProcessNamespace`, a different field."
      - id: c
        text: "The network namespace of the node."
        explanation: "That is `hostNetwork`."
      - id: d
        text: "Root access to the file system of the node."
        explanation: "File access to the node comes from a `hostPath` volume or a privileged container."
    correct_option: a
    explanation: "`hostPID` removes the process separation between the pod and the node."
  - id: ats041-040-q05
    type: single_choice
    difficulty: intermediate
    learning_objective: "Reason about NetworkPolicy peers"
    source_readings:
      - sections/section-040/module-02/course-01-network-segmentation-with-networkpolicy.md
    prompt: |-
      A NetworkPolicy ingress rule has a `from` list with two items: a `podSelector` for `app: loader`, and a separate item with a `namespaceSelector` for `starfleet`. Which sources does the rule allow?
    options:
      - id: a
        text: "Only pods labelled `app: loader` in `starfleet`."
        explanation: "That is the result when both selectors are in one list item (AND). Here they are two items."
      - id: b
        text: "No source, because the two items cancel each other."
        explanation: "Peers add allowed sources and never cancel each other."
      - id: c
        text: "Pods labelled `app: loader` in the policy namespace, and every pod in `starfleet`."
        explanation: "Correct. Items in a `from` list are alternatives (OR)."
      - id: d
        text: "Every pod in the cluster."
        explanation: "The rule limits the sources to the two peers."
    correct_option: c
    explanation: "Items in a `from` list are alternatives (OR)."
  - id: ats041-040-q06
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain egress policy and DNS"
    source_readings:
      - sections/section-040/module-02/course-01-network-segmentation-with-networkpolicy.md
    prompt: |-
      An Egress NetworkPolicy selects the `courier` pods and allows only TCP port 8080 to the `scribe` pods. `courier` can no longer reach `scribe` by its Service name. What is the likely cause?
    options:
      - id: a
        text: "Egress policies block traffic to pods in the same namespace."
        explanation: "The policy allows traffic to the `scribe` pods, so this is not the cause."
      - id: b
        text: "The policy has no rule for DNS, so the name lookup to the cluster DNS is blocked."
        explanation: "Correct. A pod selected for Egress may send only what the rules allow, and that includes DNS traffic on port 53."
      - id: c
        text: "The Service port is 80, so the policy must allow port 80."
        explanation: "Policies match the container port, which is 8080."
      - id: d
        text: "The network plugin deleted the Service."
        explanation: "A policy does not delete objects."
    correct_option: b
    explanation: "A pod selected for Egress may send only what the rules allow, and that includes DNS traffic on port 53."
  - id: ats041-040-q07
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain ResourceQuota and LimitRange together"
    source_readings:
      - sections/section-040/module-02/course-02-resource-and-identity-limits.md
    prompt: |-
      A namespace has a ResourceQuota on `requests.memory`. A user creates a pod without a memory request and no LimitRange sets a default. What happens?
    options:
      - id: a
        text: "The pod is created with a request of zero."
        explanation: "With a quota on that resource, a pod must state it or receive a default."
      - id: b
        text: "The pod is created and the quota kills it later."
        explanation: "A quota acts at admission and does not stop running pods."
      - id: c
        text: "The kubelet adds a memory request to the pod."
        explanation: "The kubelet does not add requests to meet a quota."
      - id: d
        text: "The API server rejects the pod with `403 Forbidden`."
        explanation: "Correct. A LimitRange default request would let such a pod pass the quota check."
    correct_option: d
    explanation: "A LimitRange default request would let such a pod pass the quota check."
  - id: ats041-040-q08
    type: single_choice
    difficulty: advanced
    learning_objective: "Choose a stronger boundary for untrusted code"
    source_readings:
      - sections/section-040/module-02/course-03-stronger-boundaries-sandboxes-and-dedicated-nodes.md
    prompt: |-
      A platform runs code that customers upload. Which design gives the strongest boundary between customers?
    options:
      - id: a
        text: "Separate clusters, or dedicated nodes with a sandboxed `RuntimeClass`, so the customers do not share a kernel."
        explanation: "Correct. Untrusted code needs a boundary that removes the shared kernel."
      - id: b
        text: "One namespace for each customer on shared nodes."
        explanation: "A namespace scopes names. The customers still share the node kernel."
      - id: c
        text: "A NetworkPolicy that denies all traffic between customers."
        explanation: "A NetworkPolicy limits network paths and leaves the shared kernel."
      - id: d
        text: "A ResourceQuota for each customer."
        explanation: "A quota limits resource use and does not separate kernels."
    correct_option: a
    explanation: "Untrusted code needs a boundary that removes the shared kernel."
