# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Application Code And Workload Protection (PLAYGROUND) — playground environment.
# A clean sandbox: it starts, applies the starting manifests, then stays running
# for free exploration. No task, no grading, no `astrona submit`.
apiVersion: astrona.io/v1
metadata:
  name: ats-041-playground-060-01
  docs:
    guide: docs/overview.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - mccutchen/go-httpbin:2.25.0
      - curlimages/curl:8.22.0

bootstrap:
  manifests:
    - name: starfleet
      type: file
      source: manifests/starfleet.yaml
    - name: credentials
      type: file
      source: manifests/credentials.yaml
  waitFor:
    - resource: deploy/scout
      namespace: starfleet
    - resource: deploy/probe
      namespace: starfleet
    - resource: deploy/shuttle
      namespace: starfleet
    - resource: deploy/drifter
      namespace: outpost
    - resource: deploy/legacy-report
      namespace: starfleet

teardown:
  keepCluster: false
