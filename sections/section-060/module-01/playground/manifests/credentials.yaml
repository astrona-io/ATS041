# The credential examples for the module-01 playground:
# - a Secret scout-db,
# - legacy-report, which keeps a password as a literal value in its pod template (on purpose),
# - a Role that lets the shuttle service account read every Secret in starfleet (on purpose).
apiVersion: v1
kind: Secret
metadata:
  name: scout-db
  namespace: starfleet
type: Opaque
stringData:
  password: starfleet-db-pass
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: legacy-report
  namespace: starfleet
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: legacy-report
  namespace: starfleet
  labels:
    app: legacy-report
spec:
  replicas: 1
  selector:
    matchLabels:
      app: legacy-report
  template:
    metadata:
      labels:
        app: legacy-report
    spec:
      serviceAccountName: legacy-report
      automountServiceAccountToken: false
      containers:
        - name: legacy-report
          image: curlimages/curl:8.22.0
          command: ["sh", "-c", "while true; do sleep 30; done"]
          env:
            - name: DB_PASSWORD
              value: starfleet-db-pass
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secret-reader
  namespace: starfleet
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: shuttle-secret-reader
  namespace: starfleet
subjects:
  - kind: ServiceAccount
    name: shuttle
    namespace: starfleet
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: secret-reader
