# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Application Code And Workload Protection (LAB). Graded against the live cluster.
apiVersion: astrona.io/v1
metadata:
  name: ats-041-lab-060-01
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - mccutchen/go-httpbin:2.25.0
      - curlimages/curl:8.22.0

# Starting state: the Starfleet workloads, a ledger Deployment with a literal
# password in its pod template, and a Role that lets shuttle read Secrets.
bootstrap:
  init:
    - name: seed-cluster
      description: Create the workloads and the credential weaknesses
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: secret-holds-the-password
      description: The Secret ledger-db holds the original password in the key password
      type: file
      source: validation/validate-secret-holds-the-password.sh
      hint: Create a Secret named ledger-db in starfleet with the key password. Use the value that the ledger pod template has now.
    - name: no-plaintext-credential
      description: The ledger pod template has no literal password
      type: file
      source: validation/validate-no-plaintext-credential.sh
      hint: Remove the DB_PASSWORD entry that has a value. A secretKeyRef instead of a value would also hide it, but the task asks for a volume.
    - name: secret-mounted-read-only
      description: ledger mounts ledger-db as a read-only volume at /etc/ledger-db
      type: file
      source: validation/validate-secret-mounted-read-only.sh
      hint: Add a secret volume for ledger-db and a volumeMount with readOnly true at /etc/ledger-db in the ledger container.
    - name: shuttle-cannot-read-secrets
      description: shuttle may not get, list or watch Secrets
      type: file
      source: validation/validate-shuttle-cannot-read-secrets.sh
      hint: Find the RoleBinding that names shuttle and delete it. Keep the service account.
    - name: ledger-available
      description: ledger is rolled out and the other workloads are unchanged
      type: file
      source: validation/validate-ledger-available.sh
      hint: Wait for the rollout. If the pod does not start, describe it. Do not change scout, probe or shuttle.

teardown:
  keepCluster: false
