# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Containing A Compromised Workload (LAB). Graded against the live cluster.
apiVersion: astrona.io/v1
metadata:
  name: ats-041-lab-060-02
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - mccutchen/go-httpbin:2.25.0
      - curlimages/curl:8.22.0

# Starting state: the Starfleet workloads with no securityContext, and no
# LimitRange or ResourceQuota in starfleet. The learner adds them.
bootstrap:
  init:
    - name: seed-cluster
      description: Create the Starfleet workloads
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: probe-hardened
      description: The probe pod template has the container settings
      type: file
      source: validation/validate-probe-hardened.sh
      hint: Set runAsNonRoot, runAsUser 65532 and seccompProfile RuntimeDefault on the pod, and allowPrivilegeEscalation false, readOnlyRootFilesystem true and capabilities drop ALL on the probe container.
    - name: probe-available
      description: probe runs with the settings and the other workloads are unchanged
      type: file
      source: validation/validate-probe-available.sh
      hint: Wait for the rollout. The running pods must carry the settings. If a pod does not start, describe it.
    - name: limitrange-defaults
      description: The LimitRange container-defaults sets the default memory values
      type: file
      source: validation/validate-limitrange-defaults.sh
      hint: Create a LimitRange named container-defaults in starfleet with type Container, default memory 64Mi and defaultRequest memory 32Mi.
    - name: quota-spec
      description: The ResourceQuota starfleet-quota caps pods and memory limits
      type: file
      source: validation/validate-quota-spec.sh
      hint: Create a ResourceQuota named starfleet-quota in starfleet with hard pods 10 and limits.memory 1Gi.
    - name: quota-enforced
      description: The API server admits a pod with no resources and rejects a pod over the quota
      type: file
      source: validation/validate-quota-enforced.sh
      hint: A quota on limits.memory needs the LimitRange defaults, or every pod without a limit is rejected. A pod that asks for a 2Gi limit must be rejected.

teardown:
  keepCluster: false
