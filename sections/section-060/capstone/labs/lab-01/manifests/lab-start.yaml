# The orbit namespace for the capstone. beacon (go-httpbin) has three weaknesses,
# left in place on purpose: a literal API token in the pod template, no
# securityContext and no resources, and a service account that may read Secrets
# and receives an API token it does not use.
apiVersion: v1
kind: Namespace
metadata:
  name: orbit
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: beacon
  namespace: orbit
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beacon
  namespace: orbit
  labels:
    app: beacon
spec:
  replicas: 1
  selector:
    matchLabels:
      app: beacon
  template:
    metadata:
      labels:
        app: beacon
    spec:
      serviceAccountName: beacon
      containers:
        - name: beacon
          image: mccutchen/go-httpbin:2.25.0
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: API_TOKEN
              value: beacon-token-9
---
apiVersion: v1
kind: Service
metadata:
  name: beacon
  namespace: orbit
spec:
  selector:
    app: beacon
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: beacon-secrets
  namespace: orbit
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: beacon-secrets
  namespace: orbit
subjects:
  - kind: ServiceAccount
    name: beacon
    namespace: orbit
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: beacon-secrets
