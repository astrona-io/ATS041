# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Workload And Application Code Security Capstone (LAB). Graded against the live cluster.
apiVersion: astrona.io/v1
metadata:
  name: ats-041-capstone-060
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - mccutchen/go-httpbin:2.25.0
      - curlimages/curl:8.22.0

# Starting state: namespace orbit with the beacon workload, a literal API
# token, no container settings, no limits, and a Role that lets beacon read
# Secrets.
bootstrap:
  init:
    - name: seed-cluster
      description: Create the orbit namespace and the beacon workload
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: token-from-secret
      description: The API token comes from the Secret beacon-credentials and not from a literal
      type: file
      source: validation/validate-token-from-secret.sh
      hint: Create the Secret beacon-credentials with the key token and the original value. Use a secretKeyRef for API_TOKEN and remove the literal value.
    - name: beacon-hardened
      description: The beacon container has the container settings
      type: file
      source: validation/validate-beacon-hardened.sh
      hint: runAsNonRoot, runAsUser 65532, RuntimeDefault, allowPrivilegeEscalation false, readOnlyRootFilesystem true and capabilities drop ALL.
    - name: beacon-bounded
      description: beacon has a memory request and limit and orbit has a ResourceQuota
      type: file
      source: validation/validate-beacon-bounded.sh
      hint: Set requests and limits for memory on the container and create the ResourceQuota orbit-quota with hard pods 5 and limits.memory 512Mi.
    - name: no-api-access
      description: beacon cannot read Secrets and gets no API token
      type: file
      source: validation/validate-no-api-access.sh
      hint: Delete the RoleBinding beacon-secrets and set automountServiceAccountToken to false in the pod template.
    - name: beacon-serving
      description: beacon runs with the settings and its Service has an endpoint
      type: file
      source: validation/validate-beacon-serving.sh
      hint: Wait for the rollout. A quota on limits.memory rejects pods that have no memory limit, so set the limit before you create the quota.

teardown:
  keepCluster: false
