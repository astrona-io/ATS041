# Knowledge check for section 060. Listed in astrona.yaml as a `type: quiz` entry after the capstone lab.
schema_version: 1
kind: question_bank
id: ats041-060
course_id: ATS041
exam_code: KCSA
status: alpha
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: section
  id: section-060
  title: "Workload and Application Code Security"
questions:
  - id: ats041-060-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Tell apart what the platform checks and what the application code must check"
    source_readings:
      - sections/section-060/module-01/course-01-protecting-application-inputs-data-and-dependencies.md
    prompt: |-
      A `scout` API returns the order of any id that a logged-in caller sends in the URL. A tester logs in as one user and reads the order of another user by changing the id. The cluster has strict RBAC and a Pod Security level of restricted. Where is the flaw and who must fix it?
    options:
      - id: a
        text: "The Kubernetes RBAC rules, because RBAC decides which user may read an order."
        explanation: "RBAC controls access to the Kubernetes API, not to rows in the application's own data."
      - id: b
        text: "The application code, which authenticates the caller but does not check that the caller may read that order. The code must apply authorization on every request."
        explanation: "Correct. Authentication proves who the caller is. Authorization decides what that caller may do, and only the code knows the business rule for an order."
      - id: c
        text: "The Pod Security level, which must be raised to stop one user reading another user's data."
        explanation: "Pod Security limits the pod's settings on the node. It does not see application requests."
      - id: d
        text: "The container runtime, which must filter the request before the application receives it."
        explanation: "A runtime does not know the business rule, so it cannot filter this request."
    correct_option: b
    explanation: "Platform controls do not replace authorization in the application. The code must check authorization for each object on each request."

  - id: ats041-060-q02
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain injection and where input must be validated"
    source_readings:
      - sections/section-060/module-01/course-01-protecting-application-inputs-data-and-dependencies.md
    prompt: |-
      A service builds a database query by joining a user-supplied name into the query string. A caller sends a name that contains query syntax and reads other records. Which change fixes the cause?
    options:
      - id: a
        text: "Put the service behind a NetworkPolicy that only allows the front end."
        explanation: "A NetworkPolicy limits connections but the request from the allowed front end still carries the input."
      - id: b
        text: "Run the container with `readOnlyRootFilesystem: true`."
        explanation: "A read-only file system does not change how the query string is built."
      - id: c
        text: "Pass the value as a parameter of a prepared query, so the database treats it as data and never as part of the command."
        explanation: "Correct. Injection happens when untrusted input becomes part of a command. Parameters keep data and command apart."
      - id: d
        text: "Hide the error messages, so the caller cannot see that the query broke."
        explanation: "Hiding errors may slow an attacker but does not remove the flaw."
    correct_option: c
    explanation: "Injection is fixed where the command is built: separate the data from the command and validate the input on the server side."

  - id: ats041-060-q03
    type: single_choice
    difficulty: beginner
    learning_objective: "Choose how a workload receives a credential and see who may read it"
    source_readings:
      - sections/section-060/module-01/course-02-delivering-credentials-to-a-workload.md
    prompt: |-
      A team stores a database password as a literal `value` in the pod template of a Deployment. Which statement is correct and what is the better design?
    options:
      - id: a
        text: "The literal is safe, because the pod template is only readable by the cluster administrator."
        explanation: "Users with read access to Deployments, and tools that export manifests, see the value."
      - id: b
        text: "Anyone who can read the Deployment can read the password. Store it in a Secret and reference it with `secretKeyRef` or a Secret volume, and limit who may `get` and `list` Secrets with RBAC."
        explanation: "Correct. A Secret separates the credential from the workload definition, and RBAC then controls who reads it. The list and watch verbs also return the Secret values."
      - id: c
        text: "Base64 encoding the literal in the template protects it from readers."
        explanation: "Base64 is an encoding and not encryption. Anyone can decode it."
      - id: d
        text: "Moving it to a ConfigMap protects it, because ConfigMaps are encrypted."
        explanation: "A ConfigMap is for non-sensitive data and is not encrypted."
    correct_option: b
    explanation: "Keep credentials out of manifests. Use a Secret, deliver it by reference, and restrict read access with RBAC."

  - id: ats041-060-q04
    type: single_choice
    difficulty: intermediate
    learning_objective: "Describe how Secret rotation reaches a running pod"
    source_readings:
      - sections/section-060/module-01/course-02-delivering-credentials-to-a-workload.md
    prompt: |-
      The team updates the value in a Secret. One pod reads it through an environment variable and a second pod mounts it as a volume. Both pods keep running. What is the expected result?
    options:
      - id: a
        text: "Both pods see the new value at once."
        explanation: "Environment variables are set when the container starts and do not change in a running container."
      - id: b
        text: "Neither pod ever sees the new value without a rebuild of the image."
        explanation: "The value comes from the Secret, not from the image. A restart is enough for the variable."
      - id: c
        text: "The environment variable keeps the old value until the container restarts. The mounted file is updated by the kubelet after a delay."
        explanation: "Correct. Environment variables are fixed at container start. The kubelet refreshes mounted Secret files periodically."
      - id: d
        text: "The environment variable updates and the mounted file keeps the old value."
        explanation: "The two behaviours are the other way round."
    correct_option: c
    explanation: "A Secret used as an environment variable needs a container restart to pick up a new value. A volume is refreshed by the kubelet over time."

  - id: ats041-060-q05
    type: single_choice
    difficulty: intermediate
    learning_objective: "Match each testing activity to the evidence that it gives"
    source_readings:
      - sections/section-060/module-01/course-03-testing-code-and-dependencies.md
    prompt: |-
      A team wants to know whether any library in its image has a published vulnerability, and it wants the answer on every build without running the application. Which activity gives this?
    options:
      - id: a
        text: "Dynamic Application Security Testing (DAST), which sends requests to a running instance."
        explanation: "DAST needs a running application and tests behaviour, not component versions."
      - id: b
        text: "Fuzzing, which feeds random input to the program."
        explanation: "Fuzzing finds new crashes. It does not read a vulnerability database."
      - id: c
        text: "Software Composition Analysis (SCA), which compares the components and their versions with a database of known vulnerabilities."
        explanation: "Correct. SCA matches component versions against known CVEs and runs on a build without starting the application."
      - id: d
        text: "Secret scanning, which searches for committed credentials."
        explanation: "Secret scanning looks for credentials and says nothing about vulnerable libraries."
    correct_option: c
    explanation: "SCA answers whether a component version has a known flaw. It does not find new flaws and does not prove the code calls the vulnerable function."

  - id: ats041-060-q06
    type: single_choice
    difficulty: advanced
    learning_objective: "Identify the exact image that a pod runs and what a tag does not guarantee"
    source_readings:
      - sections/section-060/module-01/course-03-testing-code-and-dependencies.md
    prompt: |-
      A scan approved the image `scout:1.4`. Later a different image is pushed under the same tag. A pod created afterwards runs the new content. Which practice prevents this?
    options:
      - id: a
        text: "Use the tag `latest`, because it always points at the approved image."
        explanation: "The tag `latest` is a movable pointer and is the least stable choice."
      - id: b
        text: "Reference the image by its digest, which identifies the exact content, and compare it with the `imageID` in the pod status."
        explanation: "Correct. A digest names the content, so the scan result applies to what runs. The pod status `imageID` shows the digest that was pulled."
      - id: c
        text: "Set `imagePullPolicy: Never` on every pod."
        explanation: "Never pulling only works when the image is already on the node, and does not identify its content."
      - id: d
        text: "Add the label `approved: true` to the pod."
        explanation: "A label is a free text and proves nothing about the image."
    correct_option: b
    explanation: "Tags can move. A digest pins the content, and the scan result then belongs to the exact image that runs."

  - id: ats041-060-q07
    type: single_choice
    difficulty: intermediate
    learning_objective: "Write a securityContext that limits what a compromised process can do"
    source_readings:
      - sections/section-060/module-02/course-01-container-settings-that-limit-a-compromised-process.md
    prompt: |-
      An attacker gets a shell in a container. The team wants to stop the attacker from writing tools to the container file system and from gaining more privileges through a setuid program. Which settings do this?
    options:
      - id: a
        text: "`readOnlyRootFilesystem: true` and `allowPrivilegeEscalation: false`."
        explanation: "Correct. A read-only root blocks writes to the image file system, and `allowPrivilegeEscalation: false` sets `no_new_privs`, so a setuid program cannot raise the privileges."
      - id: b
        text: "`runAsUser: 0` and `privileged: true`."
        explanation: "Root and privileged mode give the attacker more power."
      - id: c
        text: "`hostNetwork: true` and `hostPID: true`."
        explanation: "Host namespaces widen the access to the node."
      - id: d
        text: "`imagePullPolicy: Always` and `restartPolicy: Never`."
        explanation: "These settings control image pulls and restarts, not process privileges."
    correct_option: a
    explanation: "Combine a non-root user, dropped capabilities, no privilege escalation, a read-only root file system and the RuntimeDefault seccomp profile."

  - id: ats041-060-q08
    type: single_choice
    difficulty: advanced
    learning_objective: "Use requests, limits, LimitRange and ResourceQuota to bound a workload"
    source_readings:
      - sections/section-060/module-02/course-02-resource-limits-and-bounded-work.md
    prompt: |-
      A namespace has a ResourceQuota on `limits.memory`. A developer applies a Deployment whose pods have no memory limit, and no LimitRange exists. The Deployment is created but no pod starts. What is the cause and the fix?
    options:
      - id: a
        text: "The nodes have no memory. Add a node."
        explanation: "The failure comes from admission, before scheduling to a node."
      - id: b
        text: "The quota rejects each pod without a memory limit, so the ReplicaSet cannot create pods. Add memory limits to the pods, or create a LimitRange that supplies a default limit."
        explanation: "Correct. With a quota on `limits.memory`, a pod must state a limit. A LimitRange default or an explicit limit solves it, and the events of the ReplicaSet show the quota error."
      - id: c
        text: "The quota only counts requests, so the fault is in the image."
        explanation: "A quota on `limits.memory` counts limits, and the pod never reaches the image pull."
      - id: d
        text: "The kubelet needs a restart to read the quota."
        explanation: "The quota is enforced by the API server at admission, not by the kubelet."
    correct_option: b
    explanation: "A ResourceQuota on a resource requires pods to set it. A LimitRange can supply the defaults so the pods are admitted."
