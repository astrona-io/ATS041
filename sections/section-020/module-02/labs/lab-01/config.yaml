# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Control Plane, Node And Data Boundaries (LAB). Graded against the live cluster.
apiVersion: astrona.io/v1
metadata:
  name: ats-041-lab-020-02
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - mccutchen/go-httpbin:2.25.0
      - curlimages/curl:8.22.0

# Starting state: the Starfleet workloads, an unauthenticated view binding, a
# node-inspector Deployment with a hostPath mount, a Secret that scout can
# read, and no Pod Security labels.
bootstrap:
  init:
    - name: seed-cluster
      description: Create the workloads and the exposure objects
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: anonymous-access-removed
      description: Unauthenticated callers cannot read pods
      type: file
      source: validation/validate-anonymous-access-removed.sh
      hint: Find the ClusterRoleBinding that names the group system:unauthenticated and gives it the view role, and delete it. Keep the built-in public-info-viewer binding.
    - name: node-inspector-removed
      description: No workload in starfleet mounts a host path
      type: file
      source: validation/validate-node-inspector-removed.sh
      hint: Delete the node-inspector Deployment. A pod that mounts a node directory has no safe form under baseline.
    - name: baseline-enforced
      description: starfleet enforces baseline and rejects a host path pod
      type: file
      source: validation/validate-baseline-enforced.sh
      hint: Label the namespace pod-security.kubernetes.io/enforce=baseline. Do not use restricted, which the workloads do not meet.
    - name: scout-cannot-read-secrets
      description: scout reads its ConfigMap and no Secret
      type: file
      source: validation/validate-scout-cannot-read-secrets.sh
      hint: Remove the scout-secrets RoleBinding and add a Role that allows get on the ConfigMap fleet-settings only.
    - name: workloads-and-secret-intact
      description: The workloads run, the Secret still exists and outpost is unchanged
      type: file
      source: validation/validate-workloads-and-secret-intact.sh
      hint: Do not delete the Secret or a workload other than node-inspector, and do not label outpost.

teardown:
  keepCluster: false
