questions:
- id: ats041-section-020-q01
  type: single_choice
  difficulty: beginner
  learning_objective: Identify the asset and responsibility at each of the four security layers.
  source_readings:
  - sections/section-010/module-01/course-01-the-four-layers-and-their-trust-relationships.md
  prompt: A vulnerable application exposes another customer's report despite a hardened cluster. Which
    layer still needs a business permission check?
  options:
  - id: a
    text: Application code.
    explanation: The code layer must authorize access to the specific report.
  - id: b
    text: Only the cloud provider's physical security.
    explanation: Physical protection does not decide report ownership.
  - id: c
    text: Only etcd quorum.
    explanation: Datastore consensus does not implement the application's user rules.
  correct_option: a
  explanation: The code layer must authorize access to the specific report.
- id: ats041-section-020-q02
  type: single_choice
  difficulty: beginner
  learning_objective: Explain how failure in an outer layer can undermine inner controls.
  source_readings:
  - sections/section-010/module-01/course-01-the-four-layers-and-their-trust-relationships.md
  prompt: A node administrator can inspect workload process data. Which trust dependency does this illustrate?
  options:
  - id: a
    text: Namespaces remove all host administrative power.
    explanation: Namespace scoping does not isolate workloads from the host's ultimate authority.
  - id: b
    text: Application signatures make host access impossible.
    explanation: Origin evidence does not constrain an administrator's host access.
  - id: c
    text: Container protection depends on the host execution environment.
    explanation: A shared host or kernel is beneath the workload's isolation boundary.
  correct_option: c
  explanation: A shared host or kernel is beneath the workload's isolation boundary.
- id: ats041-section-020-q03
  type: single_choice
  difficulty: beginner
  learning_objective: Compare preventive, detective and corrective protections.
  source_readings:
  - sections/section-010/module-01/course-01-the-four-layers-and-their-trust-relationships.md
  prompt: An audit record helps investigate an unauthorized change. What type of purpose does it primarily
    serve?
  options:
  - id: a
    text: A guarantee that the API request was prevented.
    explanation: A record can describe accepted or rejected requests depending on policy.
  - id: b
    text: Detective evidence.
    explanation: Recording supports detection and investigation rather than automatically reversing the
      action.
  - id: c
    text: Automatic data restoration.
    explanation: Evidence alone does not repair changed data.
  correct_option: b
  explanation: Recording supports detection and investigation rather than automatically reversing the
    action.
- id: ats041-section-020-q04
  type: single_choice
  difficulty: beginner
  learning_objective: Explain shared responsibility for managed and self-managed infrastructure.
  source_readings:
  - sections/section-020/module-01/course-01-shared-responsibility-and-infrastructure-access.md
  prompt: A provider manages API servers, while the customer configures workload permissions. Who owns
    excessive customer workload grants?
  options:
  - id: a
    text: The customer under this stated responsibility contract.
    explanation: Managed control-plane maintenance does not transfer the declared workload permission
      duty.
  - id: b
    text: The provider automatically owns every application decision.
    explanation: Responsibility follows the actual service arrangement.
  - id: c
    text: No one because the cluster is managed.
    explanation: Shared responsibility requires defined owners.
  correct_option: a
  explanation: Managed control-plane maintenance does not transfer the declared workload permission duty.
- id: ats041-section-020-q05
  type: single_choice
  difficulty: beginner
  learning_objective: Compare network exposure controls with application permissions.
  source_readings:
  - sections/section-020/module-01/course-01-shared-responsibility-and-infrastructure-access.md
  prompt: A firewall permits an API connection. Does that establish permission to change workloads?
  options:
  - id: a
    text: Yes; any reachable caller is an administrator.
    explanation: An allowed path does not establish an allowed operation.
  - id: b
    text: Only if the firewall rule has the workload's name.
    explanation: Rule names do not define API grants.
  - id: c
    text: No; the API still authenticates and authorizes the request.
    explanation: Network reachability and API authority are separate boundaries.
  correct_option: c
  explanation: Network reachability and API authority are separate boundaries.
