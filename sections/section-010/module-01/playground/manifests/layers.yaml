# Starting state for the four-layers playground.
# - legacy-agent: a pod on a service account bound to cluster-admin.
# - privileged-debug: a privileged pod that mounts the node's /etc directory.
# Both are deliberate weaknesses for the reader to find.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: legacy-agent
  namespace: starfleet
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: legacy-agent-admin
subjects:
  - kind: ServiceAccount
    name: legacy-agent
    namespace: starfleet
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: legacy-agent
  namespace: starfleet
  labels:
    app: legacy-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: legacy-agent
  template:
    metadata:
      labels:
        app: legacy-agent
    spec:
      serviceAccountName: legacy-agent
      containers:
        - name: legacy-agent
          image: curlimages/curl:8.22.0
          command: ["sh", "-c", "while true; do sleep 30; done"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: privileged-debug
  namespace: starfleet
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: privileged-debug
  namespace: starfleet
  labels:
    app: privileged-debug
spec:
  replicas: 1
  selector:
    matchLabels:
      app: privileged-debug
  template:
    metadata:
      labels:
        app: privileged-debug
    spec:
      serviceAccountName: privileged-debug
      containers:
        - name: debug
          image: curlimages/curl:8.22.0
          command: ["sh", "-c", "while true; do sleep 30; done"]
          securityContext:
            privileged: true
          volumeMounts:
            - name: host-etc
              mountPath: /host-etc
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
      volumes:
        - name: host-etc
          hostPath:
            path: /etc
            type: Directory
