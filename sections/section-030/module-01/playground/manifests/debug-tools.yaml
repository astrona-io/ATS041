---
# A privileged debug Deployment, on purpose. It breaks the baseline level.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: debug-tools
  namespace: starfleet
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: debug-tools
  namespace: starfleet
  labels:
    app: debug-tools
spec:
  replicas: 1
  selector:
    matchLabels:
      app: debug-tools
  template:
    metadata:
      labels:
        app: debug-tools
    spec:
      serviceAccountName: debug-tools
      containers:
        - name: debug-tools
          image: curlimages/curl:8.22.0
          command: ["sleep", "infinity"]
          securityContext:
            privileged: true
